<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Mode Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        .bg-performance { background: linear-gradient(135deg, #1a0b0b 0%, #4a0e0e 100%); }
        .bg-eco { background: linear-gradient(135deg, #0f1c15 0%, #1a3c28 100%); }
        .bg-sleep { background: linear-gradient(135deg, #0a0a1a 0%, #151535 100%); }
        .bg-custom { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px currentColor; }
            50% { box-shadow: 0 0 25px currentColor; }
        }
        .mode-active {
            animation: pulse-glow 2s infinite;
            border-color: currentColor;
            transform: scale(1.05);
        }
        .transition-all-soft { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4 overflow-hidden relative">
    <div id="bg-overlay" class="absolute inset-0 z-0 transition-all-soft bg-performance"></div>
    <main class="relative z-10 w-full max-w-md">
        <header class="mb-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full glass-panel mb-4 text-3xl" id="status-icon">⚡</div>
            <h1 class="text-3xl font-bold tracking-tight mb-2">System Mode</h1>
            <p class="text-sm opacity-70 font-light">Current Status: <span id="current-mode-text" class="font-semibold uppercase tracking-wider">Performance</span></p>
        </header>
        <div class="grid grid-cols-3 gap-3 mb-6">
            <button onclick="setMode('performance')" id="btn-performance" class="glass-panel p-4 rounded-xl flex flex-col items-center justify-center gap-2 hover:bg-white/10 transition-all-soft group">
                <span class="text-2xl group-hover:scale-110 transition-transform">🚀</span>
                <span class="text-xs font-semibold uppercase">Perf</span>
            </button>
            <button onclick="setMode('eco')" id="btn-eco" class="glass-panel p-4 rounded-xl flex flex-col items-center justify-center gap-2 hover:bg-white/10 transition-all-soft group">
                <span class="text-2xl group-hover:scale-110 transition-transform">🌿</span>
                <span class="text-xs font-semibold uppercase">Eco</span>
            </button>
            <button onclick="setMode('sleep')" id="btn-sleep" class="glass-panel p-4 rounded-xl flex flex-col items-center justify-center gap-2 hover:bg-white/10 transition-all-soft group">
                <span class="text-2xl group-hover:scale-110 transition-transform">💤</span>
                <span class="text-xs font-semibold uppercase">Sleep</span>
            </button>
        </div>
        <div class="glass-panel rounded-xl p-5 mb-6">
            <label class="block text-xs font-bold uppercase tracking-widest mb-3 opacity-80">Custom Configuration</label>
            <input type="text" id="custom-name-input" placeholder="Mode Name (e.g., Gaming)" 
                class="w-full bg-black/20 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-white/30 transition-colors placeholder-white/20 mb-3">
            <textarea id="custom-desc-input" rows="3" placeholder="Describe what this mode does..." 
                class="w-full bg-black/20 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-white/30 transition-colors placeholder-white/20 resize-none mb-3"></textarea>
            <button onclick="applyCustomMode()" 
                class="w-full bg-white/10 hover:bg-white/20 border border-white/10 text-white font-medium py-2 rounded-lg transition-all-soft text-sm flex items-center justify-center gap-2">
                <span>Apply Custom Mode</span>
            </button>
        </div>
        <div id="details-panel" class="glass-panel rounded-xl p-4 text-center transition-all-soft opacity-0 translate-y-4">
            <p id="details-text" class="text-sm italic opacity-80"></p>
        </div>
    </main>
    <script>
        const state = {
            currentMode: 'performance',
            modes: {
                performance: { name: 'Performance', icon: '🚀', bgClass: 'bg-performance', color: '#ff4d4d', desc: 'Maximum CPU/GPU utilization. Fans at 100%. Best for rendering and gaming.' },
                eco: { name: 'Eco', icon: '🌿', bgClass: 'bg-eco', color: '#4dff88', desc: 'Power saving active. Background processes limited. Extended battery life.' },
                sleep: { name: 'Sleep', icon: '💤', bgClass: 'bg-sleep', color: '#8888ff', desc: 'System suspended to RAM. Minimal power draw. Wake on keypress.' },
                custom: { name: 'Custom', icon: '⚙️', bgClass: 'bg-custom', color: '#ffffff', desc: '' }
            }
        };
        const body = document.body;
        const bgOverlay = document.getElementById('bg-overlay');
        const statusIcon = document.getElementById('status-icon');
        const currentModeText = document.getElementById('current-mode-text');
        const detailsPanel = document.getElementById('details-panel');
        const detailsText = document.getElementById('details-text');
        const btns = {
            performance: document.getElementById('btn-performance'),
            eco: document.getElementById('btn-eco'),
            sleep: document.getElementById('btn-sleep')
        };
        setMode('performance');
        function setMode(modeKey) {
            const modeData = state.modes[modeKey];
            if (!modeData) return;
            state.currentMode = modeKey;
            currentModeText.textContent = modeData.name;
            statusIcon.textContent = modeData.icon;
            statusIcon.style.color = modeData.color;
            statusIcon.style.borderColor = modeData.color;
            currentModeText.style.color = modeData.color;
            bgOverlay.className = `absolute inset-0 z-0 transition-all-soft ${modeData.bgClass}`;
            Object.keys(btns).forEach(key => {
                const btn = btns[key];
                if (key === modeKey) {
                    btn.classList.add('mode-active');
                    btn.style.color = modeData.color;
                    btn.style.borderColor = modeData.color;
                } else {
                    btn.classList.remove('mode-active');
                    btn.style.color = '';
                    btn.style.borderColor = '';
                }
            });
            if (modeKey === 'custom' && !modeData.desc) {
                detailsPanel.style.opacity = '0';
                detailsPanel.style.transform = 'translateY(1rem)';
            } else {
                detailsText.textContent = modeData.desc;
                detailsPanel.style.opacity = '1';
                detailsPanel.style.transform = 'translateY(0)';
            }
        }
        function applyCustomMode() {
            const nameInput = document.getElementById('custom-name-input');
            const descInput = document.getElementById('custom-desc-input');
            const name = nameInput.value.trim();
            const desc = descInput.value.trim();
            if (!name) { alert("Please enter a mode name."); return; }
            state.modes.custom.name = name;
            state.modes.custom.desc = desc || "User defined configuration.";
            setMode('custom');
            nameInput.value = '';
            descInput.value = '';
        }
    </script>
</body>
</html>
